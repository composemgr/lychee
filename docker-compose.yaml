# nginx proxy address - http://172.17.0.1:8083
# NOTE: Lychee v7 uses FrankenPHP on port 8000 (ghcr.io/lycheeorg/lychee)

name: lychee
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  lychee:
    image: ghcr.io/lycheeorg/lychee:latest
    pull_policy: always
    container_name: lychee-app
    restart: always
    logging: *default-logging
    networks:
      - lychee
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8083:8000"
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: lychee-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      APP_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      APP_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      DB_CONNECTION: mysql
      DB_HOST: lychee-db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_CREATE_DATABASE_NAME:-lychee}
      DB_USERNAME: ${DB_USER_NAME:-lychee}
      DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MAIL_MAILER: smtp
      MAIL_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      MAIL_PORT: ${EMAIL_SERVER_PORT:-587}
      MAIL_USERNAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      MAIL_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      MAIL_FROM_ADDRESS: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
      MAIL_ENCRYPTION: tls
    volumes:
      - ./volumes/data/lychee/uploads:/app/public/uploads
      - ./volumes/data/lychee/logs:/app/storage/logs
      - ./volumes/data/lychee/tmp:/app/storage/tmp
      - ./volumes/data/lychee/app:/app/storage/app
    depends_on:
      lychee-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://lychee-app:8000'
      - 'cloudflare.hostname=lychee.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.lychee-app.entrypoints=http'
      - 'traefik.http.routers.lychee-app-secure.tls=true'
      - 'traefik.http.routers.lychee-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.lychee-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.lychee-app.middlewares=lychee-app-https-redirect'
      - 'traefik.http.routers.lychee-app-secure.entrypoints=https'
      - 'traefik.http.routers.lychee-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.lychee-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.lychee-app-secure.service=lychee-app'
      - 'traefik.http.services.lychee-app.loadbalancer.server.port=8000'

  lychee-db:
    image: mariadb:latest
    pull_policy: always
    container_name: lychee-db
    restart: always
    logging: *default-logging
    networks:
      - lychee
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: lychee-db
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-lychee}
      MARIADB_USER: ${DB_USER_NAME:-lychee}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - ./volumes/data/db/mariadb/lychee:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  lychee:
    name: lychee
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
